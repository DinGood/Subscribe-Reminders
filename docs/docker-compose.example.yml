# 订阅提醒站 Docker Compose 示例（放 VPS 上使用；镜像构建在本项目根目录）
# 用法示例：
#   docker build -t sub-reminders <项目目录>
#   或直接把本文件与源码放一起：docker compose up -d --build
services:
  sub-reminders:
    build: .
    image: sub-reminders:latest
    container_name: sub-reminders
    restart: unless-stopped
    ports:
      # 只绑 VPS 的 127.0.0.1：管理访问走 SSH 隧道 ssh -L 8766:127.0.0.1:8766 vps
      # 需要挂反代/CF 时再改绑定，并同步开 SUB_COOKIE_SECURE（https 场景）
      - "127.0.0.1:8766:8766"
    environment:
      SUB_AUTH_ENABLED: "1"        # 鉴权常开（容器语境默认值本就是 1，写明防误解）
      SUB_HOST: 0.0.0.0            # 容器内必须 0.0.0.0（已在镜像 ENV，重复声明防歧义）
      # SUB_ADMIN_PASSWORD: admin    # 可选：改首启默认口令（默认 admin）
      # SUB_COOKIE_SECURE: "1"     # 前置 https 反代时开启
    volumes:
      - sub-data:/data             # 必须命名卷（SQLite WAL 对 bind mount 跨文件系统敏感）
    # ⚠️ 严禁 scale/多实例：调度+推送随进程起，双跑=提醒双发

volumes:
  sub-data:
